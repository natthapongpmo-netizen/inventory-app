name: Deploy to Production

on:
  push:
    branches: [main]

# สิทธิ์ที่จำเป็นสำหรับ deploy ขึ้น GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ----------------------------------------------
  # Job 1: Push migrations ขึ้น Supabase
  # ----------------------------------------------
  deploy-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link to Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # ----------------------------------------------
  # Job 2: Build เป็น static site แล้ว deploy ขึ้น GitHub Pages
  # ----------------------------------------------
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: deploy-database
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      # คำนวณ base path อัตโนมัติจากชื่อ repo:
      # ถ้า repo ชื่อ <username>.github.io -> เว็บอยู่ที่ root ไม่ต้องมี base path
      # ถ้าเป็นชื่ออื่น -> ต้องมี base path เป็น /ชื่อ-repo เสมอ
      - name: Determine base path
        id: basepath
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_BASE_PATH: ${{ steps.basepath.outputs.path }}

      # สำคัญ: ถ้าไม่มีไฟล์นี้ GitHub จะรัน Jekyll ประมวลผลไฟล์ก่อนเสิร์ฟ
      # และ Jekyll จะมองข้ามโฟลเดอร์ที่ขึ้นต้นด้วย _ (เช่น _next ที่ Next.js ใช้เก็บ JS/CSS)
      # ทำให้ CSS/JS ทั้งหมดหายไปหมด
      - name: Disable Jekyll processing
        run: touch ./out/.nojekyll

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
